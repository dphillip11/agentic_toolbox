# Agentic CI — generated by the `initialise` skill from .agentic/templates/agentic.yml
#
# Placeholders filled at init time from .agentic/env.json:
#   {{PROJECT_NAME}}    project name
#   {{SETUP_STEPS}}     YAML steps that install toolchains/dependencies
#   {{BUILD_COMMAND}}   build command ('true' if the project has no build step)
#   {{TEST_COMMAND}}    test command
#   {{DEFAULT_BRANCH}}  usually 'main'
#
# On push to {{DEFAULT_BRANCH}}, after build+test pass, the knowledge base is
# recompiled for changed files and committed back with [skip ci].

name: "Agentic CI — {{PROJECT_NAME}}"

on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- project setup (from env.json setup/ci.setup_steps) ---
      {{SETUP_STEPS}}

      - name: Build
        run: {{BUILD_COMMAND}}

      - name: Test
        run: {{TEST_COMMAND}}

  update-knowledge-base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/{{DEFAULT_BRANCH}}'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kb tooling
        run: pip install -r .agentic/scripts/requirements.txt

      - name: Rebuild knowledge base for changed files
        run: |
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            python .agentic/scripts/kb_build.py --since "${{ github.event.before }}"
          else
            python .agentic/scripts/kb_build.py
          fi

      - name: Commit updated knowledge base
        run: |
          if [ -n "$(git status --porcelain .agentic/kb)" ]; then
            git config user.name "agentic-kb-bot"
            git config user.email "agentic-kb-bot@users.noreply.github.com"
            git add .agentic/kb
            git commit -m "chore(kb): update knowledge base [skip ci]"
            git push
          else
            echo "knowledge base already up to date"
          fi
